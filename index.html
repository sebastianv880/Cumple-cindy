<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Cumpleaños Cindy ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                linear-gradient(to bottom, #ff9ecf, #ffd6e8, #fff1f7);
            text-align: center;
        }

        .contenedor {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            padding: 25px 15px 30px;
        }

        /* =========================
           ESTRELLAS
        ========================= */

        .estrella {
            position: absolute;
            color: white;
            font-size: 22px;
            animation: brillar 2s infinite alternate;
            pointer-events: none;
        }

        @keyframes brillar {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* =========================
           TITULO
        ========================= */

        .titulo {
            position: relative;
            z-index: 10;
            margin: 10px auto 0;
            color: #c2185b;
            font-size: clamp(28px, 5vw, 52px);
            line-height: 1.15;
            max-width: 900px;
            text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
            animation: aparecer 2s ease;
        }

        .mensaje {
            position: relative;
            z-index: 10;
            margin: 15px auto 0;
            color: #8e1749;
            font-size: clamp(17px, 2.5vw, 25px);
            line-height: 1.5;
            font-weight: 500;
            max-width: 800px;
            animation: aparecer 3s ease;
        }

        /* =========================
           GLOBO
        ========================= */

        .globo {
            position: relative;
            width: min(230px, 58vw);
            height: 350px;
            margin: 25px auto 0;
            z-index: 5;
            animation: flotar 4s ease-in-out infinite;
        }

        .globo-cuerpo {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(210px, 55vw);
            height: min(250px, 60vw);
            border-radius: 50% 50% 45% 45%;

            background:
                linear-gradient(
                    90deg,
                    #e91e63 0%,
                    #ff80ab 30%,
                    #f8bbd0 50%,
                    #ff80ab 70%,
                    #e91e63 100%
                );

            border: 5px solid #ad1457;

            box-shadow:
                0 10px 30px rgba(173,20,87,0.35);

            transition:
                transform 1s ease,
                opacity 1s ease;
        }

        .globo-cuerpo::before {
            content: "";
            position: absolute;
            width: 5px;
            height: 88%;
            background: rgba(173,20,87,0.4);
            left: 50%;
            top: 6%;
        }

        .nombre {
            position: absolute;
            top: 38%;
            left: 0;
            width: 100%;
            color: white;
            font-size: clamp(25px, 6vw, 32px);
            font-weight: bold;
            text-shadow: 2px 2px 4px #ad1457;
            z-index: 3;
        }

        /* =========================
           CUERDAS
        ========================= */

        .cuerda {
            position: absolute;
            width: 3px;
            height: 55px;
            background: #795548;
            top: 225px;
            transition: opacity 0.5s ease;
        }

        .cuerda.izquierda {
            left: 48px;
            transform: rotate(8deg);
        }

        .cuerda.derecha {
            right: 48px;
            transform: rotate(-8deg);
        }

        /* =========================
           CANASTA
        ========================= */

        .canasta {
            position: absolute;
            width: 85px;
            height: 55px;
            background: linear-gradient(#a1887f, #795548);
            border: 4px solid #5d4037;
            left: 50%;
            transform: translateX(-50%);
            top: 275px;
            border-radius: 5px 5px 15px 15px;
            transition:
                transform 1s ease,
                opacity 1s ease;
        }

        .canasta::after {
            content: "❤️";
            font-size: 25px;
            position: absolute;
            left: 27px;
            top: 12px;
        }

        /* =========================
           ANIMACIÓN DEL GLOBO
        ========================= */

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Cuando se abre */
        .globo.abierto .globo-cuerpo {
            animation: abrirGlobo 1.5s ease forwards;
        }

        .globo.abierto .cuerda,
        .globo.abierto .canasta {
            opacity: 0;
        }

        @keyframes abrirGlobo {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            40% {
                transform: translateX(-50%) scale(1.15);
            }

            100% {
                transform: translateX(-50%) scale(0);
                opacity: 0;
            }
        }

        /* =========================
           NUBES
        ========================= */

        .nube {
            position: absolute;
            background: white;
            border-radius: 50px;
            width: 150px;
            height: 45px;
            opacity: 0.65;
            animation: mover 25s linear infinite;
            pointer-events: none;
        }

        .nube::before,
        .nube::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .nube::before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 25px;
        }

        .nube::after {
            width: 55px;
            height: 55px;
            top: -25px;
            right: 20px;
        }

        .nube1 {
            top: 25%;
            left: -180px;
        }

        .nube2 {
            top: 65%;
            left: -200px;
            animation-duration: 32s;
            animation-delay: 8s;
        }

        @keyframes mover {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(130vw);
            }
        }

        /* =========================
           BOTÓN
        ========================= */

        button {
            position: relative;
            z-index: 20;

            margin-top: -5px;

            padding: 13px 25px;

            border: none;
            border-radius: 30px;

            background: #e91e63;
            color: white;

            font-size: clamp(16px, 3vw, 19px);
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.2);

            transition:
                transform 0.3s ease,
                background 0.3s ease;
        }

        button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        /* =========================
           MENSAJE SORPRESA
        ========================= */

        #sorpresa {
            display: none;

            position: relative;
            z-index: 30;

            max-width: 800px;

            margin: 25px auto 0;

            padding: 20px;

            color: #c2185b;

            font-size: clamp(18px, 3vw, 25px);

            line-height: 1.5;

            font-weight: bold;

            background: rgba(255,255,255,0.65);

            border-radius: 25px;

            box-shadow:
                0 8px 25px rgba(194,24,91,0.18);

            animation: mensajeSorpresa 1.5s ease forwards;
        }

        @keyframes mensajeSorpresa {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           CORAZONES
        ========================= */

        .corazones {
            margin-top: 10px;
            font-size: 28px;
            animation: latido 1s infinite;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* =========================
           TEXTO INFERIOR
        ========================= */

        .abajo {
            position: relative;
            z-index: 10;

            margin-top: 20px;

            color: #ad1457;

            font-size: clamp(14px, 2vw, 18px);

            font-weight: bold;
        }

        /* =========================
           ANIMACIÓN DE APARICIÓN
        ========================= */

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 600px) {

            .contenedor {
                padding-top: 18px;
            }

            .titulo {
                margin-top: 5px;
            }

            .mensaje {
                margin-top: 10px;
            }

            .globo {
                margin-top: 15px;
                transform: scale(0.82);
                transform-origin: top center;
                margin-bottom: -55px;
            }

            button {
                margin-top: 5px;
                padding: 12px 20px;
            }

            #sorpresa {
                margin-top: 20px;
                padding: 16px;
            }

            .abajo {
                margin-top: 18px;
            }
        }

        /* =========================
           CELULARES PEQUEÑOS
        ========================= */

        @media (max-width: 380px) {

            .titulo {
                font-size: 27px;
            }

            .mensaje {
                font-size: 16px;
            }

            .globo {
                transform: scale(0.70);
                margin-bottom: -100px;
            }

            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <!-- ESTRELLAS -->

    <div class="estrella" style="top:10%; left:10%;">✨</div>
    <div class="estrella" style="top:15%; left:80%;">✨</div>
    <div class="estrella" style="top:40%; left:15%;">💖</div>
    <div class="estrella" style="top:35%; left:90%;">✨</div>
    <div class="estrella" style="top:75%; left:8%;">💕</div>
    <div class="estrella" style="top:80%; left:88%;">✨</div>

    <!-- NUBES -->

    <div class="nube nube1"></div>
    <div class="nube nube2"></div>

    <!-- TITULO -->

    <h1 class="titulo">
        🎂 ¡Feliz Cumpleaños, Amor! 🎂
    </h1>

    <p class="mensaje">
        Cindy, que cumplas muchos más ❤️<br>
        Que todos tus sueños se hagan realidad.
    </p>

    <!-- GLOBO -->

    <div class="globo" id="globo">

        <div class="globo-cuerpo">
            <div class="nombre">
                CINDY ❤️
            </div>
        </div>

        <div class="cuerda izquierda"></div>
        <div class="cuerda derecha"></div>

        <div class="canasta"></div>

    </div>

    <!-- BOTÓN -->

    <button onclick="mostrarSorpresa()">
        💌 Una sorpresa para ti
    </button>

    <!-- MENSAJE -->

    <div id="sorpresa">

        💕 Te deseo un cumpleaños hermoso, Cindy. 💕

        <br><br>

        Gracias por existir y hacer mi vida más bonita. ❤️

        <div class="corazones">
            💖 💕 💗 💕 💖
        </div>

    </div>

    <div class="abajo">
        Hecho con mucho amor para Cindy ❤️
    </div>

</div>

<script>

    function mostrarSorpresa() {

        const globo = document.getElementById("globo");
        const sorpresa = document.getElementById("sorpresa");
        const boton = document.querySelector("button");

        // Abrir el globo
        globo.classList.add("abierto");

        // Mostrar mensaje después de que empieza a abrirse
        setTimeout(function() {

            sorpresa.style.display = "block";

            boton.style.display = "none";

            // Desplazar suavemente hacia el mensaje
            sorpresa.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }, 900);
    }

</script>

</body>
</html>
