```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Amor ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #ff9ecf, #ffd6e8, #fff1f7);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Estrellas */
        .estrella {
            position: absolute;
            color: white;
            font-size: 22px;
            animation: brillar 2s infinite alternate;
        }

        @keyframes brillar {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .titulo {
            position: relative;
            z-index: 10;
            margin-top: 45px;
            color: #c2185b;
            font-size: 45px;
            text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
            animation: aparecer 2s ease;
        }

        .mensaje {
            position: relative;
            z-index: 10;
            margin-top: 15px;
            color: #8e1749;
            font-size: 24px;
            font-weight: 500;
            animation: aparecer 3s ease;
        }

        .corazon {
            color: #ff1744;
            font-size: 35px;
            animation: latido 1s infinite;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* Globo */
        .globo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            animation: flotar 4s ease-in-out infinite;
            z-index: 5;
        }

        .globo-cuerpo {
            width: 210px;
            height: 250px;
            border-radius: 50% 50% 45% 45%;
            background: linear-gradient(
                90deg,
                #e91e63 0%,
                #ff80ab 30%,
                #f8bbd0 50%,
                #ff80ab 70%,
                #e91e63 100%
            );
            border: 5px solid #ad1457;
            position: relative;
            box-shadow: 0 10px 30px rgba(173,20,87,0.35);
        }

        .globo-cuerpo::before {
            content: "";
            position: absolute;
            width: 5px;
            height: 220px;
            background: rgba(173,20,87,0.4);
            left: 50%;
            top: 10px;
        }

        .nombre {
            position: absolute;
            top: 95px;
            left: 0;
            width: 100%;
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #ad1457;
            z-index: 3;
        }

        .cuerda {
            position: absolute;
            width: 3px;
            height: 55px;
            background: #795548;
            top: 235px;
        }

        .cuerda.izquierda {
            left: 55px;
            transform: rotate(8deg);
        }

        .cuerda.derecha {
            right: 55px;
            transform: rotate(-8deg);
        }

        .canasta {
            position: absolute;
            width: 85px;
            height: 55px;
            background: linear-gradient(#a1887f, #795548);
            border: 4px solid #5d4037;
            left: 50%;
            transform: translateX(-50%);
            top: 285px;
            border-radius: 5px 5px 15px 15px;
        }

        .canasta::after {
            content: "❤️";
            font-size: 25px;
            position: absolute;
            left: 27px;
            top: 12px;
        }

        @keyframes flotar {
            0%, 100% {
                transform: translate(-50%, -50%);
            }

            50% {
                transform: translate(-50%, -57%);
            }
        }

        /* Nubes */
        .nube {
            position: absolute;
            background: white;
            border-radius: 50px;
            width: 150px;
            height: 45px;
            opacity: 0.65;
            animation: mover 20s linear infinite;
        }

        .nube::before,
        .nube::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .nube::before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 25px;
        }

        .nube::after {
            width: 55px;
            height: 55px;
            top: -25px;
            right: 20px;
        }

        .nube1 {
            top: 25%;
            left: -180px;
            animation-duration: 25s;
        }

        .nube2 {
            top: 70%;
            left: -200px;
            animation-duration: 32s;
            animation-delay: 8s;
        }

        @keyframes mover {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(130vw);
            }
        }

        .abajo {
            position: absolute;
            bottom: 25px;
            width: 100%;
            color: #ad1457;
            font-size: 18px;
            font-weight: bold;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Botón */
        button {
            position: relative;
            z-index: 20;
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        #sorpresa {
            display: none;
            position: relative;
            z-index: 30;
            margin-top: 15px;
            color: #c2185b;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <!-- Estrellas -->
    <div class="estrella" style="top:10%; left:10%;">✨</div>
    <div class="estrella" style="top:15%; left:80%;">✨</div>
    <div class="estrella" style="top:40%; left:15%;">💖</div>
    <div class="estrella" style="top:35%; left:90%;">✨</div>
    <div class="estrella" style="top:75%; left:8%;">💕</div>
    <div class="estrella" style="top:80%; left:88%;">✨</div>

    <!-- Nubes -->
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>

    <!-- Mensaje -->
    <h1 class="titulo">🎂 ¡Feliz Cumpleaños, Amor! 🎂</h1>

    <p class="mensaje">
        Cindy amor, que cumplas muchos más ❤️<br>
        Que todos tus sueños se hagan realidad.
    </p>

    <!-- Globo aerostático -->
    <div class="globo">

        <div class="globo-cuerpo">
            <div class="nombre">❤️ CINDY ❤️</div>
        </div>

        <div class="cuerda izquierda"></div>
        <div class="cuerda derecha"></div>

        <div class="canasta"></div>

    </div>

    <!-- Botón sorpresa -->
    <button onclick="mostrarSorpresa()">
        💌 Una sorpresa para ti
    </button>

    <div id="sorpresa">
        💕 Te deseo un cumpleaños hermoso, Cindy. 💕<br>
        Gracias por existir y hacer mi vida más bonita. ❤️
    </div>

    <div class="abajo">
        Hecho con mucho amor para Cindy ❤️
    </div>

</div>

<script>
    function mostrarSorpresa() {
        document.getElementById("sorpresa").style.display = "block";
    }
</script>

</body>
</html>
